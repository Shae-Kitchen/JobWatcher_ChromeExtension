<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobWatcher</title>
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <h1><img src="../../icons/icon32.png" alt="" width="18" height="18" /> JobWatcher</h1>
      <div class="actions">
        <button id="check-all" class="icon" title="Check all now">↻</button>
        <button id="open-options" class="icon" title="Settings">⚙</button>
      </div>
    </header>
    <section id="current" class="card"></section>
    <section id="watches"></section>
    <footer class="bar">
      <span id="summary" class="muted"></span>
      <button id="mark-all" class="link">Mark all as seen</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
